<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MaydayBooster</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <!-- Header Section -->
    <header>
      <div class="logo">MaydayBooster</div>
      <div class="status-badge" id="statusBadge">
        <span class="status-dot"></span>
        <span class="status-text">BYPASS</span>
      </div>
    </header>

    <!-- Main Control Card -->
    <div class="control-card">
      <!-- Volume Slider Section -->
      <div class="control-group">
        <div class="control-header">
          <span class="control-label">SES YÜKSELTME (VOLUME)</span>
          <span class="control-value" id="volValue">+0 dB</span>
        </div>
        <div class="slider-wrapper">
          <input type="range" id="volumeSlider" min="0" max="90" value="0" class="simple-slider">
        </div>
      </div>

      <!-- Sensitivity Slider Section -->
      <div class="control-group">
        <div class="control-header">
          <span class="control-label">HASSASİYET (SENSITIVITY)</span>
          <span class="control-value" id="sensValue">9</span>
        </div>
        <div class="slider-wrapper">
          <input type="range" id="sensitivitySlider" min="1" max="77" value="9" class="simple-slider">
        </div>
      </div>
    </div>

    <!-- Power Toggle Button & Footer -->
    <footer>
      <button class="power-btn" id="powerBtn">SİSTEMİ AKTİF ET</button>
      <div class="footer-links">
        <a href="#" id="githubLink" class="github-link">GitHub</a>
      </div>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
